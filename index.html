<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maria Nica Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="matrix-background"></div>
  <header>
    <h1 class="logo">My Portfolio</h1>
    <nav>
      <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>
    </nav>
  </header>
  <section class="hero">
    <div class="image-container">
      <img src="nica.jpg" alt="Maria Nica C. Gonzales">
    </div>

    <div class="text-container">
      <h2 class="name-title">Hello, I'm <span>Maria Nica C. Gonzales</span></h2>
      <h3 class="subtitle">A BSINT 3rd Year Student</h3>
      <p class="description">
        <strong>"Rise up, take courage, and do it."</strong>
      </p>
    </div>
  </section>
  <footer>
    <p>© 2025 My Portfolio | Designed by Maria Nica C. Gonzales</p>
  </footer>
  <script>
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    document.querySelector('.matrix-background').appendChild(canvas);

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const chars = '01';
    const fontSize = 16;
    let columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ffff';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      document.querySelector('.text-container').classList.add('show');
    });
  </script>
</body>
</html>
